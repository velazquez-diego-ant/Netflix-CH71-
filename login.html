<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous"></head>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="login-container">
        <div class="overlay">
            <div class="container d-flex justify-content-center align-items-center min-vh-100">
                <div class="row w-100 justify-content-center">
                 <div class="col-12 col-md-8 col-lg-6 col-xl-5">
                    <!--*CARD DEL LOGIN-->
                <div class="login-card p-4 p-md-5">
                   <div class="text-center mb-4">
                            <h1 class="netflix-logo">NETFLIX</h1>
                        </div>
                        <h2 class="login-title mb-4">Iniciar Sesion</h2>
                        
                        <form >
                            <!--*CAMPO DEL Correo-->
                            <div class="mb-3">
                                <input type="correo" class="form-control login-input" placeholder="Correo o numero de telefono">
                            </div>
                            <!--*CAMPO DE CONTRASEÑA-->
                            <div class="mb-3">
                                <input type="contraseña" class="form-control login-input" placeholder="Contraseña">
                            </div>
                            <!--*BOTON DE INICIO DE SESION-->
                            <button type="submit" class="btn btn-login w-100 mb-3">Inicia Sesion</button>
                            </div>                            
                            <div class="text-center mt-3">
                                <p class="text-secondary small">
                                    Esta pagina esta hecha por parte de la CH71 de la Sala 1.
                                </p>
                            </div>
                        </form>

                </div>    
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

</body>
</html>
