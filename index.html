<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>


    <!--* ========= Hero Banner ========= -->
    <div id="carouselExampleCaptions" class="carousel slide " data-bs-ride="carousel">
        <div class="carousel-indicators">
            <button type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide-to="0" class="active"
                aria-current="true" aria-label="Slide 1"></button>
            <button type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide-to="1"
                aria-label="Slide 2"></button>
            <button type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide-to="2"
                aria-label="Slide 3"></button>
            <button type="button" data-bs-target="#carouselExampleCaptions" data-bs-slide-to="3"
                aria-label="Slide 4"></button>
        </div>
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="access/Friends.jpg" class="d-block w-100" alt="..." height="600">
                <div class="carousel-caption d-none d-md-block">
                    <p><strong> Serie • Comedia • 1998 • 10 temporadas • </strong> TV-PG </p>
                    <button type="button" class="btn btn-light"> > Reproducir</button>
                    <button type="button" class="btn btn-secondary">Más info</button>
                </div>
            </div>
            <div class="carousel-item">
                <img src="/access/JuegosHambre.jpg" class="d-block w-100" alt="..." height="600">
                <div class="carousel-caption d-none d-md-block">
                    <h5></h5>
                    <p><strong>Pelicula • Ficcion • 20121 • 24 minutos • </strong>TV-PG </p>
                    <button type="button" class="btn btn-light"> > Reproducir</button>
                    <button type="button" class="btn btn-secondary">Más info</button>
                </div>
            </div>
            <div class="carousel-item">
                <img src="access/Naruto.jpg" class="d-block w-100" alt="..." height="600">
                <div class="carousel-caption d-none d-md-block">
                    <h5></h5>
                    <p><strong> Serie • Anime • 2007 • 21 temporadas • </strong> TV-PG </p>
                    <button type="button" class="btn btn-light"> > Reproducir</button>
                    <button type="button" class="btn btn-secondary">Más info</button>
                </div>
            </div>
            <div class="carousel-item">
                <img src="access/matrix.jpg" class="d-block w-100" alt="..." height="600">
                <div class="carousel-caption d-none d-md-block">
                    <h5></h5>
                    <p><strong> Pelicula • Ficcion • 2008 • 233 minutos • </strong> TV-PG </p>
                    <button type="button" class="btn btn-light"> > Reproducir</button>
                    <button type="button" class="btn btn-secondary">Más info</button>
                </div>
            </div>
        </div>
        <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleCaptions"
            data-bs-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Previous</span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleCaptions"
            data-bs-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Next</span>
        </button>
    </div>
    <!--* ======= End Hero Banner ======= -->

















    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

</body>

</html>
